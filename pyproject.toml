[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colmap-model-audit"
version = "0.1.0"
description = "Read-only COLMAP text-model checks for camera fields, reciprocal tracks, disconnected view graphs and merge overlap."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Afloat16"}]
dependencies = []

[project.urls]
Repository = "https://github.com/Afloat16/colmap-model-audit"
Issues = "https://github.com/Afloat16/colmap-model-audit/issues"

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
colmap-model-audit = "colmap_model_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
